name: Manifest Pages Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }

      - run: pip install jsonschema pyyaml

      - name: Generate manifest
        run: python -m scripts.generate_manifest --output manifest.json

      - name: Validate manifest against schema
        run: python -m scripts.audit_matrix --manifest manifest.json --schema schemas/manifest.schema.json

      - name: Redact sensitive fields
        run: |
          # Remove any fields that shouldn't be public
          python3 -c "
          import json
          m = json.load(open('manifest.json'))
          # Keep only safe fields
          safe = {'version', 'generated_at', 'targets'}
          for t in m.get('targets', {}).values():
              for key in list(t.keys()):
                  if key not in {'name', 'repo', 'ref', 'backend', 'arch', 'capabilities'}:
                      del t[key]
          json.dump(m, open('manifest.json', 'w'), indent=2)
          print('Manifest redacted successfully')
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: manifest.json
          name: manifest

  deploy:
    needs: build-manifest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
