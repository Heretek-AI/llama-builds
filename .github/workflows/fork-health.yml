name: Fork Health Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-forks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run fork health audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.audit_forks --output health_report.json

      - name: Check for unhealthy forks
        id: check
        run: |
          UNHEALTHY=$(python -c "
          import json
          report = json.load(open('health_report.json'))
          unhealthy = {k: v for k, v in report['targets'].items() if v['health_status'] != 'healthy'}
          print(len(unhealthy))
          ")
          echo "unhealthy_count=$UNHEALTHY" >> "$GITHUB_OUTPUT"

      - name: Create issue if unhealthy forks found
        if: steps.check.outputs.unhealthy_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('health_report.json', 'utf8'));
            const unhealthy = Object.entries(report.targets)
              .filter(([k, v]) => v.health_status !== 'healthy')
              .map(([k, v]) => `- **${k}** (${v.repo}): ${v.health_status} — ${v.days_since_commit ?? '?'} days since commit`)
              .join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fork health audit: ${Object.keys(unhealthy).length} unhealthy targets`,
              body: `## Fork Health Audit Report\n\nGenerated: ${report.generated_at}\n\n### Unhealthy Targets\n${unhealthy}\n\n### Summary\n${JSON.stringify(report.summary, null, 2)}\n\n---\n*Auto-generated by fork-health workflow*`,
              labels: ['health', 'automated']
            });

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: health_report.json
          retention-days: 30
