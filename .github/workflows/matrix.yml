name: Matrix Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      target_count: ${{ steps.set-matrix.outputs.target_count }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover build targets
        id: set-matrix
        run: |
          # Glob targets/*/build.sh and parse METADATA from each
          targets=()
          for build_script in targets/*/build.sh; do
            if [ -f "$build_script" ]; then
              target=$(basename "$(dirname "$build_script")")
              targets+=("$target")
            fi
          done

          target_count=${#targets[@]}
          echo "target_count=$target_count" >> "$GITHUB_OUTPUT"

          if [ "$target_count" -eq 0 ]; then
            echo "No targets found in targets/*/build.sh"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $target_count target(s): ${targets[*]}"

          # Build JSON matrix with METADATA from each build.sh
          matrix='{"include":['
          first=true
          for target in "${targets[@]}"; do
            build_script="targets/$target/build.sh"
            if [ ! -f "$build_script" ]; then
              continue
            fi

            # Parse METADATA block: extract backend, arch, capabilities
            backend=""
            arch=""
            capabilities=""
            in_metadata=false
            while IFS= read -r line; do
              if [[ "$line" == "# METADATA" ]]; then
                in_metadata=true
                continue
              fi
              if [[ "$in_metadata" == true && "$line" =~ ^#\ ([^=]+)=(.+)$ ]]; then
                key="${BASH_REMATCH[1]}"
                val="${BASH_REMATCH[2]}"
                case "$key" in
                  backend) backend="$val" ;;
                  arch) arch="$val" ;;
                  capabilities) capabilities="$val" ;;
                esac
              elif [[ "$in_metadata" == true && ! "$line" =~ ^#\  ]]; then
                # End of METADATA block
                in_metadata=false
                break
              fi
            done < "$build_script"

            # Default arch to x86_64 if not specified
            [ -z "$arch" ] && arch="x86_64"

            # Convert capabilities CSV to JSON array
            if [ -n "$capabilities" ]; then
              caps_json="["
              IFS=',' read -ra cap_list <<< "$capabilities"
              cap_first=true
              for cap in "${cap_list[@]}"; do
                if [ "$cap_first" = true ]; then
                  cap_first=false
                else
                  caps_json+=","
                fi
                caps_json+="\"$(echo "$cap" | xargs)\""
              done
              caps_json+="]"
            else
              caps_json="[]"
            fi

            if [ "$first" = true ]; then
              first=false
            else
              matrix+=','
            fi
            matrix+="{\"target\":\"$target\",\"backend\":\"$backend\",\"arch\":\"$arch\",\"capabilities\":$caps_json}"
          done
          matrix+=']}'

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Generated matrix: $matrix"

  build:
    needs: discover
    if: fromJson(needs.discover.outputs.matrix).include[0]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Read target METADATA
        id: meta
        run: |
          build_script="targets/${{ matrix.target }}/build.sh"
          repo=""
          ref=""

          if [ -f "$build_script" ]; then
            in_metadata=false
            while IFS= read -r line; do
              if [[ "$line" == "# METADATA" ]]; then
                in_metadata=true
                continue
              fi
              if [[ "$in_metadata" == true && "$line" =~ ^#\ ([^=]+)=(.+)$ ]]; then
                key="${BASH_REMATCH[1]}"
                val="${BASH_REMATCH[2]}"
                case "$key" in
                  repo) repo="$val" ;;
                  ref) ref="$val" ;;
                esac
              elif [[ "$in_metadata" == true && ! "$line" =~ ^#\  ]]; then
                break
              fi
            done < "$build_script"
          fi

          if [ -z "$repo" ]; then
            echo "::error::No repo found in METADATA for ${{ matrix.target }}"
            exit 1
          fi
          if [ -z "$ref" ]; then
            echo "::error::No ref found in METADATA for ${{ matrix.target }}"
            exit 1
          fi

          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "repo=$repo ref=$ref"

      - name: Build ${{ matrix.target }}
        uses: ./action.yml
        with:
          repo: ${{ steps.meta.outputs.repo }}
          ref: ${{ steps.meta.outputs.ref }}
          backend: ${{ matrix.backend }}
          arch: ${{ matrix.arch }}
